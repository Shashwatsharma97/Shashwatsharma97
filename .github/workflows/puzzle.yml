name: Chess Puzzle

on:
  schedule:
    - cron: "0 3 * * *" # a fresh puzzle once a day
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Serialize runs so two people answering at the same second (or a daily
# rotation landing mid-answer) can't race each other and corrupt the state.
concurrency:
  group: chess-puzzle
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, 'puzzle:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install chess.js
        run: npm install chess.js@1 --no-save

      - name: React to the issue
        if: github.event_name == 'issues'
        run: gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions -f content=eyes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run puzzle script
        id: run
        env:
          REPO: ${{ github.repository }}
          MODE: ${{ github.event_name == 'issues' && 'issue' || 'scheduled' }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node .github/scripts/puzzle.cjs

      - name: Commit puzzle update
        if: steps.run.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md chess/puzzle-state.json chess/board.svg
          git diff --cached --quiet || git commit -m "puzzle: update"
          git push

      - name: Reply on the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "${{ steps.run.outputs.message }}"
          gh issue close ${{ github.event.issue.number }}
